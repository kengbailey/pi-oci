name: Update Standard
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: standard-updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm,arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: update
        name: Detect new pinned inputs
        run: python3 scripts/update-standard.py
      - if: steps.update.outputs.changed == 'true'
        name: Gate the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build.py standard
          python3 tests/run.py standard
          sudo python3 tests/runc.py standard
          python3 scripts/sources.py standard
      - if: steps.update.outputs.changed == 'true'
        name: Commit and publish only the passing Standard update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Do not race a maintainer or release an update built against stale code.
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracks/standard/
          git commit -m 'Update Standard pinned runtime after acceptance tests'
          git push origin HEAD:main
          python3 -c 'import json,subprocess; from pathlib import Path; p=Path("out/standard/build-info.json"); d=json.loads(p.read_text()); d["git_commit"]=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(); p.write_text(json.dumps(d,indent=2)+"\n")'
          python3 scripts/finalize.py standard
          python3 scripts/publish.py standard out/standard
